# SDAAWN Console Configuration

env_vars:
  API_KEY: ""
  CLOUDFLARE_TOKEN: ""
  DATABASE_URL: ""
  LOG_LEVEL: "INFO"
  GITHUB_TOKEN: ""
  CF_ACCOUNT_ID: ""
  CF_PAGES_PROJECT: "sdaawn"
  CF_WORKERS_NAMESPACE: ""

settings:
  console:
    theme: "light"
    auto_update: true
    notifications: true
    language: "en"
    uptime: 0.0
  cli:
    default_terminal: "powershell"
    auto_save: true
    max_history: 1000
    key_handling: "bind"
